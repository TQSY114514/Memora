<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 220" width="680" height="220">
  <defs>
    <linearGradient id="bGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>
    <linearGradient id="bGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <filter id="bShadow">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#EA580C" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Logo 标记（书架 M，左侧） -->
  <g transform="translate(20, 10) scale(0.75)">
    <rect x="44" y="40" width="32" height="160" rx="8" fill="url(#bGrad)" filter="url(#bShadow)"/>
    <rect x="180" y="40" width="32" height="160" rx="8" fill="url(#bGrad)" filter="url(#bShadow)"/>
    <line x1="60" y1="40" x2="128" y2="100" stroke="url(#bGrad2)" stroke-width="22" stroke-linecap="round"/>
    <line x1="196" y1="40" x2="128" y2="100" stroke="url(#bGrad2)" stroke-width="22" stroke-linecap="round"/>
    <line x1="76" y1="78" x2="180" y2="78" stroke="#FDE68A" stroke-width="5" stroke-linecap="round" opacity="0.7"/>
    <line x1="76" y1="128" x2="180" y2="128" stroke="#FDE68A" stroke-width="5" stroke-linecap="round" opacity="0.7"/>
    <line x1="76" y1="178" x2="180" y2="178" stroke="#FDE68A" stroke-width="5" stroke-linecap="round" opacity="0.7"/>
    <circle cx="128" cy="128" r="16" fill="#ffffff" filter="url(#bShadow)"/>
    <circle cx="128" cy="128" r="7" fill="#EA580C"/>
    <line x1="140" y1="140" x2="154" y2="154" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- 标题 -->
  <text x="270" y="95" font-family="'Inter','Segoe UI','Helvetica Neue',sans-serif" font-size="52" font-weight="800" letter-spacing="3" fill="url(#bGrad)" text-anchor="start">Memora</text>
  <text x="272" y="130" font-family="'Inter','Segoe UI','Helvetica Neue',sans-serif" font-size="18" font-weight="500" letter-spacing="5" fill="#F59E0B" text-anchor="start" opacity="0.85">AI MEMORY WORKSPACE</text>
  <text x="272" y="158" font-family="'Inter','Segoe UI','Helvetica Neue',sans-serif" font-size="13" font-weight="400" letter-spacing="3" fill="#D97706" text-anchor="start" opacity="0.6">Unified · Searchable · Local-first</text>
</svg>
