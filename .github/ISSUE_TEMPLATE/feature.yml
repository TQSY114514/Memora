name: Feature Request
description: 建议一个新功能
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 这个功能解决什么痛点？
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 建议的方案
      description: 你期望怎么实现？
  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案
      description: 考虑过其他方案吗？
  - type: textarea
    id: context
    attributes:
      label: 补充上下文