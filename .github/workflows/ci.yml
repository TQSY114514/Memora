name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

# 同一分支的新提交取消旧的运行
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# 最小权限：本工作流只需读取仓库内容与上传产物
permissions:
  contents: read

jobs:
  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # 门禁：存在 high/critical 漏洞时 CI 失败，防止依赖回退引入安全问题
      - name: Audit (high+critical gate)
        run: npm audit --audit-level=high --omit=optional

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (node)
        run: npm run typecheck:node

      - name: Typecheck (web)
        run: npm run typecheck:web

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  test:
    name: Unit Tests + Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run vitest with coverage (retry on flake)
        run: npm run test:coverage:ci

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

  perf:
    name: Search Performance Gate
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run search benchmark (threshold enforced)
        run: npm run benchmark

  demo:
    name: Demo + Memory Bench
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # demo / mem-bench 依赖 out/main 构建产物
      - name: Build (electron-vite)
        run: npm run build

      # 门禁：记忆检索三项指标（召回 / 时态 / 去重）达标，否则失败
      - name: Run memory retrieval benchmark (threshold enforced)
        run: npm run mem-bench

      # 门禁：一键「换 AI」演示可复现，防止演示链路回归
      - name: Run one-click AI-switch demo
        run: npm run demo

      - name: Upload generated demo output
        uses: actions/upload-artifact@v4
        with:
          name: demo-output
          path: demo/output/
          retention-days: 14

  build:
    name: Build + Smoke Test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (electron-vite)
        run: npm run build

      - name: Smoke test — verify output files exist
        run: |
          test -f out/main/index.js
          test -f out/preload/index.js
          test -f out/renderer/index.html
          echo "Smoke test passed: all output files exist"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: out-${{ matrix.os }}
          path: out/
          retention-days: 7
